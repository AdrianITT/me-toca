name: metoca
description: "Me Toca — calculadoras laborales y fiscales para México."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  calc_engine:
    path: ../packages/calc_engine
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2F6B4F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FBF7F0"
  image: assets/icon/app_icon.png
  color_dark: "#121614"
  image_dark: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FBF7F0"
