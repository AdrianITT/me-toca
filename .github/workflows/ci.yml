name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calc-engine:
    name: Calc engine (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/calc_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    name: App (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
